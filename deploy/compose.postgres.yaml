name: llama-web
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: llama-web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:18472:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "llama-web"]
      interval: 5s
      timeout: 3s
      retries: 12
secrets:
  postgres_password:
    file: ${HOME}/.config/llama-web/postgres-password
volumes:
  postgres_data:
